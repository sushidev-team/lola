name: Build & Publish Release Artifacts

# Reusable: release-please.yml calls this once it cuts a release (release_created
# == true). Also exposes workflow_dispatch so the artifact build can be re-run
# against an existing tag WITHOUT a new release — handy the first time the Apple
# signing secrets land after a release already went out.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version without the v prefix (e.g. 1.2.3)'
        required: true
        type: string
      tag:
        description: 'Git tag (e.g. v1.2.3)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix (e.g. 1.2.3)'
        required: true
        type: string
      tag:
        description: 'Git tag (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write # upload artifacts onto the release-please-created release

jobs:
  # CLI binaries (darwin+linux, amd64+arm64) via goreleaser. release-please
  # already created the GitHub Release + notes, so goreleaser runs in append
  # mode (changelog disabled) — it only uploads the archives + checksums.
  release:
    runs-on: macos-latest # native darwin build; also cross-compiles linux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # goreleaser needs full history + the tag for versioning

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build, sign, notarize and attach the desktop .app (as a universal DMG) to the
  # SAME release. The in-app updater (desktop/internal/update) downloads this DMG
  # from the public repo's release.
  #
  # Requires the Apple Developer secrets below. Without them this job fails while
  # the CLI release above still succeeds. A notarized DMG is what lets Gatekeeper
  # open the auto-installed update without a warning.
  desktop:
    needs: release
    runs-on: macos-latest
    env:
      # Must match desktop/Taskfile.yml's APP_NAME — darwin:package:universal
      # writes bin/{{.APP_NAME}}.app, and sign/notarize/staple/DMG all read this.
      APP_PATH: desktop/bin/Lola.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.117

      - name: Build universal .app (version-stamped)
        working-directory: desktop
        run: wails3 task darwin:package:universal VERSION=${{ inputs.version }}

      - name: Import code signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          # Sign by the identity's SHA-1, resolved from the keychain we just
          # filled — never by a hardcoded "Developer ID Application: <entity>"
          # string. That string embeds the legal entity name, so re-issuing the
          # certificate under a renamed entity (Sushi Dev KG -> Sushi Dev GmbH)
          # broke every release with "no identity found" while the certificate
          # itself was perfectly good. A hash cannot drift, and it is not a
          # secret. The explicit failure below also tells the two cases apart:
          # a p12 that carries no PRIVATE KEY imports a certificate but no
          # identity, which produced the same misleading message.
          IDENT_HASH=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$IDENT_HASH" ]; then
            echo "::error::no 'Developer ID Application' identity in the imported keychain."
            echo "APPLE_CERTIFICATE must be a p12 carrying BOTH the certificate and its private key."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "IDENT_HASH=$IDENT_HASH" >> $GITHUB_ENV

      - name: Setup App Store Connect API key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          KEY=~/private_keys/AuthKey.p8
          # notarytool wants the .p8 EXACTLY as App Store Connect issued it: a PEM
          # with its BEGIN/END lines and real newlines. A secret pasted from
          # somewhere that folded the newlines away (or that holds the base64 OF
          # the file rather than its text) produces "Error: invalidPEMDocument"
          # at submit time — a message that names neither the file nor the cause.
          # So: accept both shapes, then PROVE the result parses before spending
          # a build on it.
          if printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY"
          else
            printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > "$KEY" 2>/dev/null || true
          fi
          # openssl reads the key and writes nothing anywhere: it validates the
          # document without ever putting the key in the log.
          if ! openssl pkcs8 -nocrypt -in "$KEY" -topk8 -out /dev/null 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is not a valid PEM private key."
            echo "Store the AuthKey_<KEYID>.p8 file VERBATIM, newlines and BEGIN/END lines included:"
            echo "  gh secret set APP_STORE_CONNECT_PRIVATE_KEY < AuthKey_<KEYID>.p8"
            echo "Got a $(wc -c < "$KEY" | tr -d ' ')-byte file of $(wc -l < "$KEY" | tr -d ' ') line(s); a valid key is ~240 bytes over 4+ lines."
            exit 1
          fi
          chmod 600 "$KEY"

      - name: Sign the app bundle
        run: |
          # Sign nested code first, then the bundle itself, hardened runtime on.
          find "$APP_PATH" -type f \( -name "*.dylib" -o -name "*.framework" -o -perm +111 \) -exec \
            codesign --force --options runtime --timestamp --sign "$IDENT_HASH" {} \;
          codesign --force --options runtime --timestamp --sign "$IDENT_HASH" "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Notarize the app bundle
        timeout-minutes: 15
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ditto -c -k --keepParent "$APP_PATH" app.zip
          xcrun notarytool submit app.zip \
            --key ~/private_keys/AuthKey.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait --timeout 10m
          xcrun stapler staple "$APP_PATH"
          rm app.zip

      - name: Create universal DMG
        id: dmg
        run: |
          DMG_NAME="lola-desktop-${{ inputs.version }}-universal.dmg"
          rm -rf dmg-contents && mkdir -p dmg-contents
          cp -R "$APP_PATH" dmg-contents/
          ln -s /Applications dmg-contents/Applications
          hdiutil create -volname "Lola" -srcfolder dmg-contents -ov -format UDZO "$DMG_NAME"
          echo "name=${DMG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Sign & notarize the DMG
        timeout-minutes: 15
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          DMG_NAME="${{ steps.dmg.outputs.name }}"
          codesign --force --timestamp --sign "$IDENT_HASH" "$DMG_NAME"
          xcrun notarytool submit "$DMG_NAME" \
            --key ~/private_keys/AuthKey.p8 \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait --timeout 10m
          xcrun stapler staple "$DMG_NAME"

      - name: Cleanup signing material
        if: always()
        run: |
          rm -rf ~/private_keys || true
          if [ -n "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi

      - name: Attach DMG to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ steps.dmg.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
