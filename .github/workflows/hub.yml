name: Hub

# Build and publish only. Argo CD in the cluster owns deployment.
# It runs only for the hub and the wire contract it builds against
# (hubproto/), so a lola change that touches neither deploys nothing.
on:
  push:
    branches: [main]
    paths: ['hub/**', 'hubproto/**', '.github/workflows/hub.yml']
  pull_request:
    branches: [main]
    paths: ['hub/**', 'hubproto/**', '.github/workflows/hub.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-image:
    name: Build image
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.digitalocean.com/sushidev-registry-01
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: digitalocean/action-doctl@v2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.DO_ACCESS_TOKEN }}
      - name: Log in to DigitalOcean Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: doctl registry login --expiry-seconds 600
      # The context is the repository root (the hub builds against
      # ../hubproto); hub/Dockerfile.dockerignore keeps it to hub/ and hubproto/.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: hub/Dockerfile
          # PRs build without registry credentials; only main publishes.
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/lola-hub:${{ github.sha }}
            ${{ env.REGISTRY }}/lola-hub:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lola-hub
          cache-to: type=gha,mode=max,scope=lola-hub
