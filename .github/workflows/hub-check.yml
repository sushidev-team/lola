name: Hub check

# Keep checks independent from the image-only publishing workflow.
on:
  push:
    branches: [main]
    paths: ['hub/**', 'hubproto/**', '.github/workflows/hub-check.yml']
  pull_request:
    branches: [main]
    paths: ['hub/**', 'hubproto/**', '.github/workflows/hub-check.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the running check obsolete, so it
# is cancelled. Every other run gets a group of its own (the run id), so runs on
# main, tags and releases are never cancelled or replaced by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache: false
      - name: make check
        working-directory: hub
        run: make check
