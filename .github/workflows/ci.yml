name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    # macOS, not Linux: the desktop package imports wails/v3, whose webview
    # backend needs GTK4/WebKitGTK dev libs (via pkg-config) on Linux but only
    # the built-in Cocoa/WebKit frameworks on macOS. lola-desktop ships macOS
    # only (see release.yml, also macos-latest), so `go vet/build/test ./...`
    # here exercises the real target — including the darwin-only cgo in
    # hidpi_darwin.go — without provisioning GTK on a variant that never ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"
            echo "$out"
            exit 1
          fi

      # desktop/build/** holds Wails per-platform SCAFFOLD (e.g. the ios
      # app_options fragment is `package main` with no main() — it only compiles
      # once `wails3 task ios` generates the rest). It isn't app code and can't
      # be built standalone, so exclude it from the generic Go steps.
      #
      # EVERY package runs under -race, internal/tui and internal/vtterm
      # included. They were excluded while vtterm called vt.Emulator.Close(),
      # which writes an unguarded `closed` bool that the lock-free
      # SafeEmulator.Read() reads — an upstream defect lola cannot lock from
      # outside, since Read blocks and a mutex around the pair would deadlock
      # Close against the read it is releasing. vtterm now closes the emulator's
      # input pipe directly instead (see Term.closeEmulatorInput), which is what
      # actually unblocks that read and never touches the flag, so the race is
      # gone rather than merely unobserved. Keeping the exclusion would matter
      # more than it used to: internal/panebus runs a vtterm.Term per pane
      # INSIDE the daemon and closes one on every pane teardown, so that
      # lifecycle is now on the daemon's own path.
      - name: packages
        id: pkgs
        run: |
          list=$(go list ./... | grep -v '/desktop/build/')
          echo "list=$(echo "$list" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: go vet
        run: go vet ${{ steps.pkgs.outputs.list }}

      - name: build
        run: go build ${{ steps.pkgs.outputs.list }}

      - name: test (race)
        run: go test -race -count=1 ${{ steps.pkgs.outputs.list }}

      # The lola_insecure half of the M1 remote listener compiles ONLY under its
      # build tag, so nothing above touches it: the insecure authorizer, the
      # daemon wiring that starts a listener and their tests are all invisible
      # to an untagged run. Without this step that path can rot silently, and it
      # is the path that decides whether a bearer key can reach a socket at all.
      # The untagged build stays the one that ships — `go tool nm` on it finds
      # none of these symbols — which is exactly why both have to be green.
      - name: build/vet/test (lola_insecure)
        run: |
          go build -tags lola_insecure ${{ steps.pkgs.outputs.list }}
          go vet -tags lola_insecure ${{ steps.pkgs.outputs.list }}
          go test -race -count=1 -tags lola_insecure ${{ steps.pkgs.outputs.list }}
