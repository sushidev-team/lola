name: Mobile
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'desktop/frontend/**', '.github/workflows/mobile.yml']
  pull_request:
    branches: [main]
    paths: ['mobile/**', 'desktop/frontend/**', '.github/workflows/mobile.yml']
permissions:
  contents: read

# A newer push to the same pull request makes the running check obsolete, so it
# is cancelled. Every other run gets a group of its own (the run id), so runs on
# main, tags and releases are never cancelled or replaced by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  web:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/frontend/package-lock.json
            mobile/package-lock.json
            mobile/plugins/lola-transport/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend      # shared components resolve their deps here
      - run: npm ci
        working-directory: mobile/plugins/lola-transport
      - run: npm ci
        working-directory: mobile
      - run: npm run check
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: npm run build && npm run budget
        working-directory: mobile
