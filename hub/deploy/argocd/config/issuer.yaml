apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lola-letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Set an operator email here if you want ACME account notifications.
    privateKeySecretRef:
      name: lola-letsencrypt-production-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
