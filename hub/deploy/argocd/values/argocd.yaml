fullnameOverride: argocd
redis:
  enabled: false
redisSecretInit:
  enabled: false
externalRedis:
  host: argocd-valkey.argocd.svc.cluster.local
  existingSecret: argocd-valkey-auth
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
configs:
  cm:
    # Needed for app-of-apps sync waves to wait for child Applications.
    resource.customizations.health.argoproj.io_Application: |
      hs = {status = "Progressing", message = "Waiting for child application"}
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
        if obj.status.sync == nil or obj.status.sync.status ~= "Synced" then
          hs.status = "Progressing"
        end
      end
      return hs
  params:
    timeout.reconciliation: 60s
    timeout.reconciliation.jitter: 15s
controller:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
repoServer:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
