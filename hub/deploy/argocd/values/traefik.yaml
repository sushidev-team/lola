fullnameOverride: traefik
deployment:
  replicas: 2
providers:
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
    publishedService:
      enabled: true
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
experimental:
  abortOnPluginFailure: true
  plugins:
    crowdsec:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.8.2
volumes:
  - name: crowdsec-bouncer
    mountPath: /crowdsec
    type: secret
service:
  annotations:
    # L4 preserves source IP; do NOT enable PROXY protocol on a network LB.
    service.beta.kubernetes.io/do-loadbalancer-type: REGIONAL_NETWORK
    service.beta.kubernetes.io/do-loadbalancer-name: lola-traefik
  spec:
    externalTrafficPolicy: Local
ports:
  web:
    port: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    forwardedHeaders:
      insecure: false
      trustedIPs: []
  websecure:
    port: 443
    forwardedHeaders:
      insecure: false
      trustedIPs: []
    transport:
      respondingTimeouts:
        readTimeout: 60s
        writeTimeout: 0s
        idleTimeout: 3600s
securityContext:
  capabilities:
    drop: [ALL]
    add: [NET_BIND_SERVICE]
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
ingressRoute:
  dashboard:
    enabled: false
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
    queryParameters:
      defaultMode: drop
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 384Mi}
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
