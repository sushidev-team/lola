container_runtime: containerd
# Fixed, external credentials avoid random Helm values changing each Argo sync.
secrets:
  externalSecret:
    name: crowdsec-machine-auth
lapi:
  replicas: 1
  env:
    - name: BOUNCER_KEY_traefik
      valueFrom:
        secretKeyRef:
          name: crowdsec-bouncer
          key: BOUNCER_KEY_traefik
  persistentVolume:
    data:
      storageClassName: lola-block-storage-retain
      size: 10Gi
    config:
      # Configuration is rebuilt from Git + externally supplied credentials.
      enabled: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 512Mi}
agent:
  # DaemonSet reads the local Traefik container logs on every node.
  acquisition:
    - namespace: traefik
      podName: traefik-*
      program: traefik
  env:
    - name: COLLECTIONS
      value: crowdsecurity/traefik
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}
appsec:
  enabled: true
  replicas: 1
  acquisitions:
    - source: appsec
      listen_addr: 0.0.0.0:7422
      appsec_configs: [crowdsecurity/appsec-default]
      labels:
        type: appsec
  env:
    - name: COLLECTIONS
      value: crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "2", memory: 768Mi}
