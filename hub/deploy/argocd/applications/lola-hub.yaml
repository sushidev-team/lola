apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lola-hub
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://github.com/sushidev-team/lola.git
    targetRevision: main
    path: hub/deploy/k8s/overlays/production
    kustomize:
      images: []
  destination:
    server: https://kubernetes.default.svc
    namespace: lola-hub
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
