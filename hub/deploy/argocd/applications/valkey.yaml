apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  project: default
  sources:
    - repoURL: https://valkey.io/valkey-helm/
      chart: valkey
      targetRevision: 1.0.0
      helm:
        releaseName: argocd-valkey
        valueFiles:
          - $values/hub/deploy/argocd/values/valkey.yaml
    - repoURL: https://github.com/sushidev-team/lola.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
