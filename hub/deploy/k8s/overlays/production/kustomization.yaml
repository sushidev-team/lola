apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lola-hub
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - middleware.yaml
  - networkpolicy.yaml
images:
  # Argo CD Image Updater replaces latest with its immutable digest.
  - name: registry.digitalocean.com/sushidev-registry-01/lola-hub
    newTag: latest
