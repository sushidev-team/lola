# Public API for daemons. Every request is signed by the device; TLS stops
# observation. Request bodies are capped at 64 KiB by the hub itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lola-hub
  annotations:
    cert-manager.io/cluster-issuer: lola-letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: lola-hub-hub-protection@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - lola.sushidev.kitchen
      secretName: lola-hub-tls
  rules:
    - host: lola.sushidev.kitchen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lola-hub
                port:
                  name: http
