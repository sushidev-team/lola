# Public API for daemons. Every request is signed by the device; TLS stops
# observation. Request bodies are capped at 64 KiB by the hub itself.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lola-hub
  annotations:
    cert-manager.io/cluster-issuer: image-proxy-letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lola.sushidev.kitchen
      secretName: lola-hub-tls
  rules:
    - host: lola.sushidev.kitchen
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lola-hub
                port:
                  name: http
