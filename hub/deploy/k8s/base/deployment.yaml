# One process per data file (README "Deploying"): exactly one replica, and
# Recreate so a rollout never runs two pods against the store at once (the
# ReadWriteOnce volume could not attach to both anyway). Second reason: the
# relay keeps control links, pending dials and splices in process memory, so a
# phone dial and its daemon's control link must land on the same process.
# Scaling out needs routing by device id and is not built. A rollout drops
# every control channel and splice; daemons reconnect, phones re-race.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lola-hub
  labels:
    app: lola-hub
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lola-hub
  template:
    metadata:
      labels:
        app: lola-hub
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        # Provisioned in the cluster; CI has no Kubernetes credentials.
        - name: registry-sushidev-registry-01
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lola-hub
          image: registry.digitalocean.com/sushidev-registry-01/lola-hub:latest
          imagePullPolicy: Always
          # TLS terminates at Traefik. The admin console binds pod
          # loopback only (the hub refuses anything else); see README
          # "Kubernetes" for the port-forward.
          args: ["serve", "--addr", ":8080", "--admin-addr", "127.0.0.1:8098", "--client-ip", "header:X-Real-Ip"]
          env:
            # A subdirectory the hub creates itself (0700), so the store and
            # admin.token do not sit in the volume root next to lost+found.
            - name: LOLA_HUB_DATA
              value: /data/hub/hub.json
          envFrom:
            # LOLA_HUB_SECRET_KEY: seals each org's Linear key and digest
            # webhook in the store. Restore the SAME key during migration.
            - secretRef:
                name: lola-hub-env
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lola-hub-data
