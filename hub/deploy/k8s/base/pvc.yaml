# The file store: device public keys, hashed enroll tokens, items, policies and
# the console's admin.token. Retain: deleting the PVC (or the namespace) must
# not delete the volume, or every device has to re-enroll.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lola-hub-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: lola-block-storage-retain
  resources:
    requests:
      storage: 10Gi
