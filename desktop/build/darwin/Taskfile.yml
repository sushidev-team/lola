version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{if eq OS "darwin"}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively on macOS
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      # VERSION is injected into main.version for the in-app update checker
      # (defaults to "dev" for local builds; the release workflow passes the git
      # tag). Only the production branch sets it — dev builds stay "dev".
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.VERSION | default "dev"}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=12.0"
      CGO_LDFLAGS: "-mmacosx-version-min=12.0"
      MACOSX_DEPLOYMENT_TARGET: "12.0"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:cli:
    summary: Builds the `lola` CLI (universal) for bundling inside the .app
    # The app is a CLIENT of the daemon: it starts one by exec'ing `lola run`,
    # and cannot re-exec itself the way the TUI does. The DMG used to carry only
    # the .app, so a fresh install had no CLI to run and the first-run wizard
    # died on "lola binary not found on PATH". Shipping the CLI inside the bundle
    # makes one artifact enough, and pins the daemon to the same commit as the
    # app (version skew there is its own class of bug: a daemon predating a
    # command answers `unknown cmd`).
    #
    # Always UNIVERSAL, regardless of the app's own arch: it is pure Go with
    # CGO off, so both slices are cheap, and create:app:bundle is shared by the
    # single-arch and universal package tasks — one artifact means neither can
    # bundle the wrong architecture.
    #
    # VERSION matches the app's, so `lola --version` and the app agree.
    internal: true
    cmds:
      # GOARCH is set PER COMMAND, not in the env: block below — that block
      # applies to every cmd alike, so both slices came out as the host arch and
      # lipo refused them ("have the same architectures").
      - GOARCH=amd64 go build {{.CLI_FLAGS}} -o "{{.BIN_DIR}}/lola-cli-amd64" github.com/sushidev-team/lola
      - GOARCH=arm64 go build {{.CLI_FLAGS}} -o "{{.BIN_DIR}}/lola-cli-arm64" github.com/sushidev-team/lola
      - lipo -create -output "{{.BIN_DIR}}/lola-cli" "{{.BIN_DIR}}/lola-cli-amd64" "{{.BIN_DIR}}/lola-cli-arm64"
      - rm -f "{{.BIN_DIR}}/lola-cli-amd64" "{{.BIN_DIR}}/lola-cli-arm64"
    vars:
      CLI_FLAGS: '-trimpath -buildvcs=false -ldflags="-w -s -X main.version={{.VERSION | default "dev"}}"'
    env:
      GOOS: darwin
      CGO_ENABLED: 0
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    generates:
      - "{{.BIN_DIR}}/lola-cli"

  package:
    summary: Packages the application into a `.app` bundle
    deps:
      - task: build
      - task: build:cli
    cmds:
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
      - task: build:cli
    cmds:
      - task: create:app:bundle


  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      # We ship an icns-only, full-bleed icon (see CLAUDE.md). The bundle dir is
      # reused across builds, so an Assets.car left by an older build must be
      # actively removed when there is no source Assets.car — otherwise Tahoe's
      # Dock keeps preferring the stale Liquid-Glass icon and the tile floats
      # smaller than its neighbours.
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
        else
          rm -f "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/Assets.car"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      # The bundled `lola` CLI. Path is a contract with desktop/lolabin.go's
      # bundledRelPath — change one and the app silently stops finding it.
      # Under Contents/Resources/bin rather than Contents/MacOS because only the
      # app's own executable belongs in MacOS; a second binary there confuses
      # bundle tooling. It is signed by build.yml's `find … -perm +111` sweep
      # before the bundle itself, so notarization covers it.
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/bin"
      - cp "{{.BIN_DIR}}/lola-cli" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/bin/lola"
      - chmod +x "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources/bin/lola"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - task: '{{if eq OS "darwin"}}codesign:adhoc{{else}}codesign:skip{{end}}'

  codesign:adhoc:
    summary: Ad-hoc signs the app bundle (macOS only)
    internal: true
    cmds:
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  run:
    # The dev bundle lives in its own bin/dev/ subdirectory rather than being
    # named "<APP_NAME>.dev.app", because macOS labels the Dock/Finder entry from
    # the bundle DIRECTORY name and honours CFBundleDisplayName only when it
    # matches that filename. A "Lola.dev.app" directory would read "Lola.dev" in
    # the Dock no matter what the plist says; "dev/Lola.app" reads "Lola".
    cmds:
      - mkdir -p "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/Resources"
      # Reused bundle dir: drop a stale Assets.car so `wails3 dev` shows the
      # icns, not an older Liquid-Glass tile that floats small (see CLAUDE.md).
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/Resources"
        else
          rm -f "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/Resources/Assets.car"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/MacOS"
      # Mirror the production bundle's CLI when one has already been built, so
      # the bundled-fallback path can be exercised under `wails3 dev`. NOT a
      # build dependency: a dev machine has `lola` on PATH (which wins anyway),
      # and rebuilding a universal CLI on every dev restart would tax the loop
      # for something dev does not need. Run `wails3 task darwin:build:cli` once
      # to test the fallback.
      - |
        if [ -f "{{.BIN_DIR}}/lola-cli" ]; then
          mkdir -p "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/Resources/bin"
          cp "{{.BIN_DIR}}/lola-cli" "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/Resources/bin/lola"
          chmod +x "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/Resources/bin/lola"
        fi
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/Info.plist"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/dev/{{.APP_NAME}}.app"
      - '"{{.BIN_DIR}}/dev/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}"'

  sign:
    summary: Signs the application bundle with Developer ID
    desc: |
      Signs the .app bundle for distribution.
      Uses signing identity from `wails3 setup` (stored in ~/.config/wails/defaults.yaml).
      Override with: task darwin:sign -- --identity "Developer ID Application: ..."
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" {{.CLI_ARGS}}

  sign:notarize:
    summary: Signs and notarizes the application bundle
    desc: |
      Signs the .app bundle and submits it for notarization.
      Uses signing identity and keychain profile from `wails3 setup`.

      First-time setup:
        wails3 setup
    deps:
      - task: package
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.app" --notarize {{.CLI_ARGS}}
